<div class="flex items-center space-x-1 h-full">
    <!-- SDD permisos-proceso-evento-rol: los botones se muestran SIEMPRE pero
         deshabilitados (gris) cuando el rol no tiene el evento (antes @if). -->
    <button mat-icon-button color="primary" (click)="onEditClicked()"
            [disabled]="!showEdit" [matTooltip]="t().actionCell.edit">
        <mat-icon>edit</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="onDeleteClicked()"
            [disabled]="!showDelete" [matTooltip]="t().actionCell.delete">
        <mat-icon>delete</mat-icon>
    </button>
</div>
