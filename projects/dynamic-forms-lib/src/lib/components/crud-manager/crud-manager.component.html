<div class="crud-manager-container">
  <div class="header-card">
    <h2 class="header-title">{{ title }}</h2>

    <div class="controls-bar">
      @if (!resolvedPermissions().readonly && resolvedPermissions().canCreate) {
      <button mat-flat-button (click)="onAdd()">
        <mat-icon>add</mat-icon> {{ t().crud.add }}
      </button>
      }

      @if (resolvedPermissions().canExport) {
      <button mat-stroked-button (click)="onExport()">
        <mat-icon>download</mat-icon> {{ t().crud.export }}
      </button>
      }

      <div class="search-container">
        <mat-icon class="search-icon">search</mat-icon>
        <input type="text" [placeholder]="t().crud.search" (input)="onQuickFilter($event)" #searchInput>
        @if(searchInput.value){
        <button class="clear-btn" (click)="clearSearch(searchInput)">
          <mat-icon>close</mat-icon>
        </button>
        }
      </div>
    </div>
  </div>

  <div class="grid-container" [ngClass]="agGridTheme()">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" class="progress" />
    }
    <ag-grid-angular 
      style="width: 100%; height: 100%;" 
      [rowData]="rowData()" 
      [columnDefs]="gridColumnDefs()"
      [defaultColDef]="defaultColDef" 
      [gridOptions]="gridOptions" 
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>

<div class="custom-modal-overlay" *ngIf="isFormOpen()">
  <div class="custom-modal-content">
    <app-forms [config]="formConfig" [mode]="formMode()" [initialData]="initialData()" [appearance]="defaultAppearance"
      (formSubmit)="handleSubmit($event)" (cancel)="handleCancel()">
    </app-forms>
  </div>
</div>
