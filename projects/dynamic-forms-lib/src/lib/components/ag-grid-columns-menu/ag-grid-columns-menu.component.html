<button
  mat-icon-button
  type="button"
  [matMenuTriggerFor]="menu"
  [disabled]="!gridApi"
  [matTooltip]="tooltip"
  [attr.aria-label]="tooltip">
  <mat-icon>view_column</mat-icon>
</button>

<mat-menu #menu="matMenu" panelClass="ag-columns-menu-panel" (opened)="onMenuOpened()">
  <div class="ag-columns-menu__header">
    <mat-icon class="ag-columns-menu__header-icon">view_column</mat-icon>
    <span class="ag-columns-menu__title">{{ title }}</span>
    <span class="ag-columns-menu__count">{{ visibleCountText() }}</span>
  </div>
  <!-- style inline: garantiza el layout vertical aunque el CSS scoped del
       componente no alcance el overlay del mat-menu (se proyecta en el body). -->
  <div class="ag-columns-menu__list" style="display: flex; flex-direction: column; max-height: 320px; overflow-y: auto; padding: 4px 0;">
    @for (item of visibleColumns(); track $index) {
      <mat-checkbox
        class="ag-columns-menu__item"
        [checked]="item.visible"
        [disabled]="isLastVisible(item)"
        (change)="toggle(item.id, $event.checked)">
        <span class="ag-columns-menu__label">{{ item.label }}</span>
      </mat-checkbox>
    }
  </div>
</mat-menu>
