<!-- Fixed AppBar at the top -->
<mat-toolbar color="primary" class="app-toolbar">
    <button 
        type="button" aria-label="Toggle sidenav" mat-icon-button 
        (click)="drawer.opened = !drawer.opened">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
    </button>
    <span>Dynamic Forms App</span>
</mat-toolbar>

<!-- Container for sidebar and content -->
<div class="layout-container">
    <mat-sidenav-container class="sidenav-container">
        <!-- Fixed Sidebar (Left) -->
        <mat-sidenav 
            #drawer 
            class="sidenav" 
            [attr.role]="isHandset() ? 'dialog' : 'navigation'"
            [mode]="isHandset() ? 'over' : 'side'" 
            [(opened)]="drawerOpened"
        >
            <div class="sidenav-content">
                <mat-toolbar class="sidenav-header">Menu</mat-toolbar>
                <mat-nav-list>
                    <a mat-list-item routerLink="/personas" routerLinkActive="active-link"
                        (click)="onMenuClick(drawer)">
                        <mat-icon matListItemIcon>people</mat-icon>
                        <span matListItemTitle>Personas</span>
                    </a>
                    <a mat-list-item routerLink="/pokemon" routerLinkActive="active-link" (click)="onMenuClick(drawer)">
                        <mat-icon matListItemIcon>catching_pokemon</mat-icon>
                        <span matListItemTitle>Pokemon</span>
                    </a>
                    <a mat-list-item routerLink="/star-wars" routerLinkActive="active-link"
                        (click)="onMenuClick(drawer)">
                        <mat-icon matListItemIcon>rocket_launch</mat-icon>
                        <span matListItemTitle>Star Wars</span>
                    </a>
                    <a mat-list-item routerLink="/olympics" routerLinkActive="active-link"
                        (click)="onMenuClick(drawer)">
                        <mat-icon matListItemIcon>emoji_events</mat-icon>
                        <span matListItemTitle>Olympics</span>
                    </a>
                    <a mat-list-item routerLink="/vehicles" routerLinkActive="active-link"
                        (click)="onMenuClick(drawer)">
                        <mat-icon matListItemIcon>directions_car</mat-icon>
                        <span matListItemTitle>Vehicles</span>
                    </a>
                </mat-nav-list>
            </div>
        </mat-sidenav>

        <!-- Settings Sidebar (Right) -->
        <mat-sidenav #settingsDrawer position="end" mode="over" class="settings-sidenav">
            <app-theme-settings (close)="settingsDrawer.close()"></app-theme-settings>
        </mat-sidenav>

        <!-- Main Content Area with independent scroll -->
        <mat-sidenav-content class="main-content">
            <div class="content-wrapper">
                <router-outlet></router-outlet>
            </div>

            <!-- Floating Settings Button -->
            <button mat-fab class="settings-fab" (click)="settingsDrawer.toggle()">
                <mat-icon>settings</mat-icon>
            </button>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
